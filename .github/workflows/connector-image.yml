name: connector-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, semver without a leading v (e.g. 1.0.0). A prerelease (1.1.0-rc.1) does not move :latest."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: connector-image
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - name: only main or a connector-v* tag may publish
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/main|refs/tags/connector-v*) echo "ref ok: $REF" ;;
            *) echo "::error::the connector image publishes only from main or a connector-v* tag (got $REF)"; exit 1 ;;
          esac
      - name: validate the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version must be semver like 1.0.0"; exit 1
          fi
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --workspace @zavi/connector --include-workspace-root=false --ignore-scripts
      - name: typecheck connector
        run: npm run typecheck -w @zavi/connector
      - name: connector tests
        run: npm test -w @zavi/connector
      - name: connector build
        env:
          CONNECTOR_VERSION: ${{ inputs.version }}
        run: npm run build -w @zavi/connector

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: connector-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/connector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            CONNECTOR_VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/rravi149/zavi-connector:${{ inputs.version }}
            ${{ needs.verify.outputs.latest == 'true' && 'ghcr.io/rravi149/zavi-connector:latest' || '' }}
          labels: |
            org.opencontainers.image.title=Zavi Connector
            org.opencontainers.image.description=Runs in your network, holds your database password, answers Zavi under your local rules.
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/rravi149/zavi-connector
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
