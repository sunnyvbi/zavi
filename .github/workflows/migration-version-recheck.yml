name: migration-version-recheck

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: migration-version-recheck
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  recheck:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    name: re-check open PRs for migration version clashes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: re-check open PRs against the new main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/migration-version-unique.mjs --main-ref origin/main --fetch-main --recheck-open-prs
