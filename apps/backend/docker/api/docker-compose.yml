
name: main

services:
  praxis-backend:
    extends:
      file: ../main/docker-compose.yml
      service: praxis-backend
    environment:
      - PRAXIS_ROLE=api

  praxis-voice-pipeline:
    extends:
      file: ../main/docker-compose.yml
      service: praxis-voice-pipeline
    depends_on:
      praxis-backend:
        condition: service_healthy
