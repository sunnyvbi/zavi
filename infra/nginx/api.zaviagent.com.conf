
server {
    listen 80;
    listen [::]:80;
    server_name api.zaviagent.com;

    client_max_body_size 6M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_request_buffering off;
    proxy_buffering off;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location /api/inngest {
        proxy_pass http://praxis_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /internal/ {
        deny all;
        return 404;
    }

    location = /api/chat/upload-video {
        client_max_body_size 55M;
        proxy_request_buffering on;
        proxy_pass http://praxis_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /api/chat/upload-doc {
        client_max_body_size 12M;
        proxy_request_buffering on;
        proxy_pass http://praxis_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /api/workspace/files {
        client_max_body_size 222M;
        proxy_request_buffering on;
        proxy_pass http://praxis_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~* "^/api/personalization/documents(/[0-9a-f-]{36}/replace)?/?$" {
        client_max_body_size 27M;
        proxy_request_buffering on;
        proxy_pass http://praxis_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://praxis_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /health {
        proxy_pass http://praxis_backend/health;
    }
}
